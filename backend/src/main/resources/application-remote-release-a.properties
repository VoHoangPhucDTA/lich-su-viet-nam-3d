# Explicit one-time profile for the controlled History RAG Release A importer.
# Flyway remains disabled here; the release migration command enables it explicitly.
spring.flyway.enabled=false
history-rag.import.release-a-enabled=true
history-rag.import.release-a-approved=${HISTORY_RAG_RELEASE_A_APPROVED:false}
history-rag.import.release-a-expected-host=${HISTORY_RAG_RELEASE_A_EXPECTED_HOST:}
history-rag.import.release-a-expected-database=${HISTORY_RAG_RELEASE_A_EXPECTED_DATABASE:lichsuvn}
history-rag.import.release-a-package-sha256=${HISTORY_RAG_RELEASE_A_PACKAGE_SHA256:}
