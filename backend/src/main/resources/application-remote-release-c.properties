# Explicit one-time profile for the controlled History RAG Release C.
spring.main.web-application-type=none
spring.task.scheduling.enabled=false
spring.flyway.enabled=false

history-rag.release-c.apply-v30=false
history-rag.release-c.enabled=true
history-rag.release-c.approved=${HISTORY_RAG_RELEASE_C_APPROVED:false}
history-rag.release-c.expected-host=${HISTORY_RAG_RELEASE_C_EXPECTED_HOST:}
history-rag.release-c.expected-database=${HISTORY_RAG_RELEASE_C_EXPECTED_DATABASE:lichsuvn}
history-rag.release-c.package-dir=${HISTORY_RAG_RELEASE_C_PACKAGE_DIR:../data/history-rag/v1}
history-rag.release-c.package-sha256=${HISTORY_RAG_RELEASE_C_PACKAGE_SHA256:}
history-rag.release-c.backup-sha256=${HISTORY_RAG_RELEASE_C_BACKUP_SHA256:}
history-rag.release-c.restore-verified=${HISTORY_RAG_RELEASE_C_RESTORE_VERIFIED:false}

history-rag.import.release-c-enabled=true
history-rag.import.release-c-approved=${HISTORY_RAG_RELEASE_C_APPROVED:false}
history-rag.import.release-c-expected-host=${HISTORY_RAG_RELEASE_C_EXPECTED_HOST:}
history-rag.import.release-c-expected-database=${HISTORY_RAG_RELEASE_C_EXPECTED_DATABASE:lichsuvn}
history-rag.import.release-c-package-sha256=${HISTORY_RAG_RELEASE_C_PACKAGE_SHA256:}
history-rag.import.release-c-backup-sha256=${HISTORY_RAG_RELEASE_C_BACKUP_SHA256:}
history-rag.import.release-c-restore-verified=${HISTORY_RAG_RELEASE_C_RESTORE_VERIFIED:false}
