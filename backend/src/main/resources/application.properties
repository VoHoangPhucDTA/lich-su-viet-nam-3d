spring.application.name=backend
spring.main.banner-mode=${SPRING_MAIN_BANNER_MODE:off}

# === Database connection ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lichsuvn?useSSL=false&connectionTimeZone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

# Exam retention is manual and dry-run by default. Do not enable on a shared database
# until a preview report has been reviewed.
exam.retention.enabled=false
exam.retention.batch-limit=100
exam.retention.anonymous-in-progress-days=7
exam.retention.anonymous-submitted-days=30
exam.retention.authenticated-in-progress-days=30
exam.retention.completed-practice-days=30
exam.retention.authenticated-submitted-days=365
exam.retention.failed-receipt-days=30
exam.retention.superseded-dataset-days=365

# === Server-issued exam sessions ===
exam.session.submit-grace-seconds=${EXAM_SESSION_SUBMIT_GRACE_SECONDS:10}

# === Flyway Migration ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# === Optional: Logging level for debug ===
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.lichsuvn.backend=${LOGGING_LEVEL_APP:INFO}
logging.level.org.flywaydb=${LOGGING_LEVEL_FLYWAYDB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:OFF}
logging.level.org.hibernate.orm.jdbc.bind=${LOGGING_LEVEL_HIBERNATE_BIND:OFF}

# === Auth / JWT ===
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.auth.email-verification-minutes=${APP_AUTH_EMAIL_VERIFICATION_MINUTES:10}

# === Internal AI Service gateway ===
app.ai-service.enabled=${AI_SERVICE_ENABLED:true}
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
app.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:5s}
app.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:90s}
app.ai-service.generation-path=${AI_SERVICE_GENERATION_PATH:/ai/quiz/generate}
app.ai-service.health-path=${AI_SERVICE_HEALTH_PATH:/ai/health}
app.ai-service.provenance-path=${AI_SERVICE_PROVENANCE_PATH:/ai/provenance/validate}
app.ai-service.internal-token=${AI_SERVICE_INTERNAL_TOKEN:}
app.ai-service.max-style-examples=${AI_SERVICE_MAX_STYLE_EXAMPLES:3}

# === AI candidate receipt retention ===
app.ai-receipt.cleanup-enabled=${AI_RECEIPT_CLEANUP_ENABLED:true}
app.ai-receipt.retention-hours=${AI_RECEIPT_RETENTION_HOURS:24}
app.ai-receipt.cleanup-cron=${AI_RECEIPT_CLEANUP_CRON:0 17 * * * *}
app.ai-receipt.cleanup-batch-size=${AI_RECEIPT_CLEANUP_BATCH_SIZE:100}

# === Social OAuth ===
# Google: set APP_AUTH_GOOGLE_CLIENT_ID to your OAuth 2.0 Web Client ID from Google Cloud Console.
# Without this, the /api/auth/oauth/google endpoint returns 503 with OAUTH_NOT_CONFIGURED.
app.oauth.google.client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}

# Facebook: set APP_AUTH_FACEBOOK_APP_ID and APP_AUTH_FACEBOOK_APP_SECRET from Meta Developer Console.
# APP_AUTH_FACEBOOK_GRAPH_VERSION is optional; defaults to v21.0.
# Without these, the /api/auth/oauth/facebook endpoint returns 503 with OAUTH_NOT_CONFIGURED.
app.oauth.facebook.app-id=${APP_AUTH_FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${APP_AUTH_FACEBOOK_APP_SECRET:}
app.oauth.facebook.graph-version=${APP_AUTH_FACEBOOK_GRAPH_VERSION:v21.0}

# === Mail / SMTP ===
# Keep credentials in environment variables. For Gmail use port 587 + STARTTLS.
app.mail.enabled=${APP_MAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}

# === Viettel AI Text-to-Speech ===
# APP_VIETTEL_AI_TOKEN is the environment variable. Set it in your .env file.
app.viettel-ai.token=${APP_VIETTEL_AI_TOKEN:}
app.tts.asset-flow-enabled=${APP_TTS_ASSET_FLOW_ENABLED:false}
app.tts.asset-pending-stale-minutes=${APP_TTS_ASSET_PENDING_STALE_MINUTES:10}
app.tts.asset-retry-delay-minutes=${APP_TTS_ASSET_RETRY_DELAY_MINUTES:2}
app.tts.asset-max-attempts=${APP_TTS_ASSET_MAX_ATTEMPTS:3}
app.tts.asset-claim-lease-seconds=${APP_TTS_ASSET_CLAIM_LEASE_SECONDS:300}
app.tts.asset-upload-max-attempts=${APP_TTS_ASSET_UPLOAD_MAX_ATTEMPTS:3}
app.tts.asset-upload-backoff-ms=${APP_TTS_ASSET_UPLOAD_BACKOFF_MS:250}
app.tts.asset-worker-core-pool-size=${APP_TTS_ASSET_WORKER_CORE_POOL_SIZE:1}
app.tts.asset-worker-max-pool-size=${APP_TTS_ASSET_WORKER_MAX_POOL_SIZE:2}
app.tts.asset-worker-queue-capacity=${APP_TTS_ASSET_WORKER_QUEUE_CAPACITY:20}
app.tts.asset-recovery-limit=${APP_TTS_ASSET_RECOVERY_LIMIT:10}
app.tts.asset-recovery-interval-ms=${APP_TTS_ASSET_RECOVERY_INTERVAL_MS:60000}
app.tts.chunk.target-length=${APP_TTS_CHUNK_TARGET_LENGTH:1800}
app.tts.chunk.hard-max-length=${APP_TTS_CHUNK_HARD_MAX_LENGTH:2000}
app.tts.chunk.version=${APP_TTS_CHUNK_VERSION:v1}
app.tts.cloudinary.narrations-folder=${APP_TTS_CLOUDINARY_NARRATIONS_FOLDER:narrations}
app.tts.cloudinary.chunks-folder=${APP_TTS_CLOUDINARY_CHUNKS_FOLDER:chunks}
app.tts.ffmpeg.executable=${APP_TTS_FFMPEG_EXECUTABLE:ffmpeg}
app.tts.ffprobe.executable=${APP_TTS_FFPROBE_EXECUTABLE:ffprobe}

# === Cloudinary (avatar management) ===
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.default-avatar=${CLOUDINARY_DEFAULT_AVATAR:}

# === Managed Admin event image upload ===
# Upload and cleanup are deliberately independent so cleanup can drain after uploads are disabled.
app.event-image-upload.enabled=${APP_EVENT_IMAGE_UPLOAD_ENABLED:false}
app.event-image-cleanup.enabled=${APP_EVENT_IMAGE_CLEANUP_ENABLED:false}
app.event-image-upload.timeout-ms=${APP_EVENT_IMAGE_UPLOAD_TIMEOUT_MS:30000}
app.event-image-upload.reservation-minutes=${APP_EVENT_IMAGE_UPLOAD_RESERVATION_MINUTES:10}
app.event-image-cleanup.interval-ms=${APP_EVENT_IMAGE_CLEANUP_INTERVAL_MS:60000}
app.event-image-cleanup.lease-seconds=${APP_EVENT_IMAGE_CLEANUP_LEASE_SECONDS:120}
app.event-image-cleanup.max-attempts=${APP_EVENT_IMAGE_CLEANUP_MAX_ATTEMPTS:5}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
