# Vite embeds these public browser settings in the generated JavaScript.
# Keep this list explicit: never exclude all VITE_* variables or output paths.
# Cesium must use a read-only browser token restricted to approved site origins;
# Cloudinary must use an unsigned upload preset with appropriate upload limits.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL,VITE_CESIUM_ION_TOKEN,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_UPLOAD_PRESET,VITE_FACEBOOK_APP_ID,VITE_GOOGLE_CLIENT_ID,VITE_TTS_ASSET_PLAYER_ENABLED"
