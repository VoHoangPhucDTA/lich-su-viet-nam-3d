name: AI service CI

on:
  push:
    branches: [ai_service]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: git diff --check HEAD^
      - run: python -m compileall -q app scripts
        working-directory: ai-service
      - run: ./mvnw -q -DskipTests compile
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Scoped lint for Goal 13E frontend surface
        run: npx eslint src/pages/exams/AiQuizPage.tsx src/pages/admin/AdminAiCandidatesPage.tsx src/pages/admin/AdminAiCandidateDetailPage.tsx src/services/aiQuizApi.ts src/services/aiCandidateApi.ts src/types/aiQuiz.ts src/types/aiCandidate.ts
        working-directory: frontend
      - run: python scripts/ci/secret_scan.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10', cache: pip, cache-dependency-path: ai-service/requirements-dev.txt}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      - run: mkdir -p artifacts/e2e
      - run: python -m pytest tests/unit tests/integration/test_deterministic_e2e_provider.py --junitxml=../artifacts/e2e/ai-unit.xml
        working-directory: ai-service
      - run: ./mvnw -Dtest='Ai*Test,HttpAi*Test' test
        working-directory: backend
      - run: npm ci && npm run test -- --reporter=default
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-unit-reports
          path: artifacts/e2e/*.xml
          retention-days: 7

  mysql-integration:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Testcontainers MySQL 8.4 migrations and schema
        run: ./mvnw -Dtest='AiMySqlMigrationIntegrationTest' test
        working-directory: backend
      - name: Repository, rollback and concurrency semantics
        run: ./mvnw -Dtest='AiRevisionRepositoryTest,AiReceiptCleanupRepositoryTest' test
        working-directory: backend
      - run: ./mvnw dependency:tree -Dincludes=org.testcontainers,com.github.docker-java,org.junit.jupiter
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-mysql-test-reports
          path: backend/target/surefire-reports/*.xml
          retention-days: 7

  compose-e2e:
    runs-on: ubuntu-latest
    needs: [static, unit, mysql-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python scripts/e2e/run_ai_e2e.py --repeat 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-compose-e2e-summary
          path: artifacts/e2e/
          retention-days: 7
