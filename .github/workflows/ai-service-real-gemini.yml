name: AI service real Gemini smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-one:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: ai-real-gemini-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10', cache: pip, cache-dependency-path: ai-service/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      - name: Count-one real provider smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_PRODUCTION_GENERATION_SMOKE: '1'
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY secret is not configured'; exit 2; }
          python -m pytest tests/integration/test_production_generation_smoke.py -q
        working-directory: ai-service
